; Zobrazovací panel: LaskaKit ESPink v3.6 (ESP32-S3) + e-paper 7,5" GDEM075F53
; (800x480, 4 barvy) + Li-Pol 4000 mAh. Většinu času spí.
; Framework: ESP-IDF (přes PlatformIO).
[env:espink]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
upload_speed = 921600
