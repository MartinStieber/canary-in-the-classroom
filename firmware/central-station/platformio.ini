; Zobrazovací panel: LaskaKit ESPink v3.6 (ESP32-S3) + e-paper 7,5" GDEM075F53
; (800x480, 4 barvy) + Li-Pol 4000 mAh. Většinu času spí.
[env:espink]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ESPink má USB-C s převodníkem (CH9102) nebo nativní USB. Pokud sériový
; monitor nic nevypisuje, zkus přepnout ARDUINO_USB_CDC_ON_BOOT na 1.
build_flags =
    -I ../common
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    zinggjm/GxEPD2@^1.6.0
