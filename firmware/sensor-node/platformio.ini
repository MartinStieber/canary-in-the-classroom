; Čidlový uzel: ESP32 DevKit + LaskaKit SCD41 (I2C), napájení z USB.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; sdílený protokol z ../common
build_flags =
    -I ../common
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    sensirion/Sensirion I2C SCD4x@^0.4.0
